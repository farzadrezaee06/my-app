<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17191F" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- تم ذخیره‌شده قبل از رندر اول اعمال می‌شه (جلوگیری از پرش رنگ موقع رفرش) -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        if (JSON.parse(localStorage.getItem('digikala:theme:v1')) === true) {
          theme = 'light';
        }
      } catch (e) { }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    html[data-theme="dark"] { background: #17191F; }
    html[data-theme="light"] { background: #F3F4F8; }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <title>Dig-Web</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
